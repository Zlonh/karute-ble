; karute-ble: BLE-native keyboard firmware.
; One codebase for ESP32-S3 (default, AtomS3U pins) and ESP32-C3.
; Switches below only change board + USB; the app protocol is identical.

[platformio]
default_envs = esp32s3

[env]
framework = arduino
upload_protocol = esptool
upload_speed = 460800
lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.2

; USB policy: TinyUSB OTG HID keyboard only. Do not enable CDC/MSC/DFU.
build_unflags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MSC_ON_BOOT=0
    -DARDUINO_USB_DFU_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0

; ====== Default: ESP32-S3 (M5Stack AtomS3U K125, GPIO41 button / GPIO35 LED) ======
[env:esp32s3]
platform = espressif32@6.12.0
board = m5stack-atoms3
extra_scripts =
    pre:scripts/generate_gbk_table.py

; ====== Generic ESP32-S3 DevKit (button GPIO9 / LED GPIO2, see top of main.cpp) ======
[env:esp32s3-devkit]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DKARUTE_BUTTON_PIN=9
    -DKARUTE_LED_PIN=2
extra_scripts =
    pre:scripts/generate_gbk_table.py

; ====== ESP32-C3-DevKitM-1 (button GPIO9 / LED GPIO8) ======
[env:esp32c3]
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DKARUTE_BUTTON_PIN=9
    -DKARUTE_LED_PIN=8
extra_scripts =
    pre:scripts/generate_gbk_table.py
