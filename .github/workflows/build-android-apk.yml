name: build-android-apk

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          mkdir -p $ANDROID_SDK_ROOT
          cd $ANDROID_SDK_ROOT
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          # 修正官方要求的目录层级：cmdline-tools/latest/bin/sdkmanager
          mv cmdline-tools latest
          mkdir -p cmdline-tools
          mv latest cmdline-tools/
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
          # 自动接受所有SDK许可
          yes | sdkmanager --licenses
          # 安装编译必需组件
          sdkmanager "platforms;android-33" "build-tools;34.0.0" "platform-tools"

      - name: Generate Gradle Wrapper
        run: |
          cd android
          gradle wrapper

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: |
          cd android
          export ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Package APK into a zip
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/karute-ble-debug.apk
          cd dist
          zip -9 karute-ble-apk.zip karute-ble-debug.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: karute-ble-apk
          path: dist/karute-ble-apk.zip

      - name: Attach to GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/karute-ble-apk.zip
          generate_release_notes: true
