name: build-android-apk

# 每次 push 到 main / 打 tag v* / 手动触发时，自动编译 Android APK。
# 产物：名为 karute-ble-apk 的 artifact（zip 包，里面是 app-debug.apk）；
# 打 tag v* 时还会自动挂到 GitHub Release 页。

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.5'
          arguments: -p android --no-daemon --stacktrace assembleDebug

      - name: Package APK into a zip
        run: |
          set -e
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/karute-ble-debug.apk
          cd dist
          zip -9 karute-ble-apk.zip karute-ble-debug.apk
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: karute-ble-apk
          path: dist/karute-ble-apk.zip

      - name: Attach to GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/karute-ble-apk.zip
          generate_release_notes: true
