name: build-android-apk

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: malf/setup-android@v2
        with:
          packages: 'platforms;android-33,build-tools;34.0.0'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Package APK into a zip
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/karute-ble-debug.apk
          cd dist
          zip -9 karute-ble-apk.zip karute-ble-debug.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: karute-ble-apk
          path: dist/karute-ble-apk.zip

      - name: Attach to GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/karute-ble-apk.zip
          generate_release_notes: true
